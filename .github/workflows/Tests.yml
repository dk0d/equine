# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Tests

on:
  push:
    branches: [ "main" ]
  # Every pull request, including stacked layers whose base is another branch.
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  # Fail instead of silently resolving a different set of versions than uv.lock.
  UV_FROZEN: "1"

jobs:
  tests:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Run tests
      run: uv run --extra tests pytest tests/ -n auto --maxprocesses=4

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: "3.11"
        enable-cache: true
    - name: Measure coverage
      run: >-
        uv run --extra tests pytest
        --cov=equine --cov-config=pyproject.toml --cov-report=term-missing
        --cov-fail-under=97 tests -n auto --maxprocesses=4
      env:
        NUMBA_DISABLE_JIT: 1

  check-repo-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: "3.11"
        enable-cache: true
    - name: Check formatting and lint
      run: |
        uv run --only-group lint ruff format src/ tests/ --diff --check
        uv run --only-group lint ruff check src/ tests/
        uv run --only-group lint codespell src/ docs/

  test-docs-builds:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: "3.11"
        enable-cache: true
    - name: Build docs
      run: uv run --extra docs mkdocs build --clean --strict
      env:
        JUPYTER_PLATFORM_DIRS: 1

  # Disabled, as it was before the uv migration: pyright does not scan clean
  # yet (it also fails on main). Run locally with:
  #   uv run --group typecheck pyright src/ --level=error
  #   uv run --group typecheck pyright --ignoreexternal --level=warning --verifytypes equine
