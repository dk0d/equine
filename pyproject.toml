[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "equine"
dynamic = ["version"]
authors = [
    { name = "Allan Wollaber" },
    { name = "Steven Jorgensen" },
    { name = "John Holodnak" },
    { name = "Jensen Dempsey" },
    { name = "Harry Li" },
]
maintainers = [{ name = "Allan Wollaber" }, { name = "Steven Jorgensen" }]
description = "EQUINE^2: Establishing Quantified Uncertainty for Neural Networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Intel macOS (x86_64 darwin) is not supported: PyTorch ships no x86_64
    # macOS wheels from 2.3.0 onward, so this floor is unsatisfiable there.
    # Apple silicon (arm64) macOS, Linux and Windows are unaffected.
    "torch >= 2.10.0",
    "torchmetrics >= 0.6.0",
    "numpy >= 2.4.0",
    "tqdm",
    "beartype",
    "icontract",
    "scipy>=1",
]
license = { text = "MIT" }
keywords = ["machine learning", "robustness", "pytorch", "responsible", "AI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
tests = [
    "pytest >= 3.8",
    "pytest-cov",
    "pytest-xdist",
    "hypothesis >= 6.105.0, < 6.166.0",
    "pre-commit >= 2.19",
    "codespell",
]

docs = [
    "mkdocs>=1.3",
    "mkdocs-material",
    "mkdocstrings-python",
    "mkdocs-jupyter",
    "mkdocs-literate-nav",
    "mkdocs-gen-files",
    "mkdocs-section-index",
]

[project.urls]
"Homepage" = "https://mit-ll-responsible-ai.github.io/equine/"
"Bug Tracker" = "https://github.com/mit-ll-responsible-ai/equine/issues"
"Source" = "https://github.com/mit-ll-responsible-ai/equine"

[dependency-groups]
lint = ["ruff", "codespell"]
typecheck = ["pyright"]

[tool.hatch.version]
source = "vcs"
# Used when no git metadata is available (sdist/tarball builds, shallow or
# tag-less clones). Tracks the latest upstream release tag, v0.1.8.
fallback-version = "0.1.8"

[tool.hatch.build.hooks.vcs]
version-file = "src/equine/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/equine"]

[tool.ruff]
line-length = 88
extend-exclude = ["src/equine/_version.py"]

[tool.ruff.lint]
# E/W (pycodestyle) + F (pyflakes) reproduce the previous flake8 checks and
# I (isort) replaces the standalone isort step. The unused-import/variable
# cleanup that autoflake handled is covered by F401/F841.
select = ["E", "F", "W", "I"]
# Mirror the rule exemptions from the previous .flake8 config. E501 (line
# length) and E203 (whitespace before punctuation) are also handled by, or
# conflict with, the formatter.
ignore = ["E203", "E501", "E701", "E721", "F403", "F405", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["equine", "tests"]
known-third-party = [
    "torch",
    "torchmetrics",
    "numpy",
    "tqdm",
    "beartype",
    "icontract",
    "scikit-learn",
    "scipy",
]
combine-as-imports = true

[tool.pytest.ini_options]
addopts = "--durations=0"
testpaths = ["tests"]
markers = [
    "aoti: AOTInductor tests; invoke a C++ compiler and are slow (deselect with '-m \"not aoti\"')",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = ["src/equine/_version.py"]
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'raise NotImplementedError',
    'raise ValueError',
    '@(abc\.)?abstractmethod',
    '@(typing\.)?overload',
    'except ImportError:',
    'except ModuleNotFoundError:',
    'if (typing\.)?TYPE_CHECKING:',
    'if sys\.version_info',
]

[tool.pyright]
include = ["src"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "src/equine/_version.py",
    "**/.hypothesis",
    "**/docs",
]
reportUnnecessaryTypeIgnoreComment = true
reportUnnecessaryIsInstance = false

[tool.codespell]
skip = 'docs/*'
