[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "equine"
dependencies = [
    "torch >= 2.14.1, < 3.0.0",
    "torchmetrics >= 1.2.1",
    "numpy >= 2.0.0, < 3.0.0",
    "tqdm >= 4.66.3",
    "beartype >= 0.22.1",
    "beartype >= 0.23.0; python_version >= '3.15'",
    "icontract >= 2.6.2",
    "scipy >= 1.13.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["version"]
authors = [
    { name = "Allan Wollaber" },
    { name = "Steven Jorgensen" },
    { name = "John Holodnak" },
    { name = "Jensen Dempsey" },
    { name = "Harry Li" },
]
maintainers = [{ name = "Allan Wollaber" }, { name = "Steven Jorgensen" }]
description = "EQUINE^2: Establishing Quantified Uncertainty for Neural Networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

license-files = ["LICENSE.md"]
keywords = ["machine learning", "robustness", "pytorch", "responsible", "AI"]

[project.optional-dependencies]
tests = [
    "pytest >= 7.3.2",
    "pytest-cov >= 4.0.0",
    "pytest-xdist >= 3.0.2",
    "hypothesis >= 6.105.0, < 6.166.0",
]

dev = ["equine[tests]", "pre-commit >= 2.19", "codespell >= 2.4.3"]

docs = [
    "mkdocs>=1.3",
    "mkdocs-material",
    "mkdocstrings>=1.0.7",
    "mkdocstrings-python",
    "mkdocs-jupyter",
    "mkdocs-literate-nav",
    "mkdocs-gen-files",
    "mkdocs-section-index",
]

[project.urls]


[dependency-groups]

[tool.hatch.version]
source = "vcs"
# Used when no git metadata is available (sdist/tarball builds, shallow or
# tag-less clones). Tracks the latest upstream release tag, v0.1.8.
fallback-version = "0.1.8"

[tool.hatch.build.hooks.vcs]
version-file = "src/equine/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/equine"]

[tool.ruff]
line-length = 88
extend-exclude = ["src/equine/_version.py"]

[tool.ruff.lint]
# E/W (pycodestyle) + F (pyflakes) reproduce the previous flake8 checks and
# I (isort) replaces the standalone isort step. The unused-import/variable
# cleanup that autoflake handled is covered by F401/F841. UP (pyupgrade)
# keeps the syntax at the Python version `requires-python` allows.
select = ["E", "F", "W", "I", "UP"]
# Mirror the rule exemptions from the previous .flake8 config. E501 (line
# length) and E203 (whitespace before punctuation) are also handled by, or
# conflict with, the formatter.
ignore = ["E203", "E501", "E701", "E721", "F403", "F405", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["equine", "tests"]
known-third-party = [
    "torch",
    "torchmetrics",
    "numpy",
    "tqdm",
    "beartype",
    "icontract",
    "scikit-learn",
    "scipy",
]
combine-as-imports = true

[tool.pytest.ini_options]
addopts = "--durations=0"
testpaths = ["tests"]
markers = [
    "aoti: AOTInductor tests; invoke a C++ compiler and are slow (deselect with '-m \"not aoti\"')",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'raise NotImplementedError',
    'raise ValueError',
    '@(abc\.)?abstractmethod',
    '@(typing\.)?overload',
    'except ImportError:',
    'except ModuleNotFoundError:',
    'if (typing\.)?TYPE_CHECKING:',
    'if sys\.version_info',
]
omit = ["src/equine/_version.py"]

[tool.pyright]
include = ["src"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "src/equine/_version.py",
    "**/.hypothesis",
    "**/docs",
]
reportUnnecessaryTypeIgnoreComment = true
reportUnnecessaryIsInstance = false

[tool.codespell]
skip = "docs/*"
